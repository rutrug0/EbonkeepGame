# Auction House Configuration
# All timing values are in minutes unless otherwise specified
# Updated: 2026-03-09

[auction.instance]
# Maximum players per auction instance
max_players_per_instance = 50

# Number of concurrent auctions per level bracket
concurrent_auctions_per_bracket = 3

# Number of items per auction
items_per_auction = 5

# Auction duration in hours
auction_duration_hours = 12

# Auction start times in UTC (comma-separated, 24-hour format)
# With 12-hour duration and 3 concurrent: start at 00:00, 08:00, 16:00
auction_start_times_utc = 0,8,16

[auction.items]
# Item rarity distribution (must sum to items_per_auction)
# Format: common,uncommon,rare,epic
rarity_distribution = 2,1,1,1

# Percentage of items that are system-generated vs player-submitted
# system_generated_percentage = 50 means 50% system, 50% player
# Set to 100 for all system-generated, 0 for all player-submitted
system_generated_percentage = 100

[auction.bidding]
# Legacy compatibility field. Proxy bidding currently advances by the fixed
# absolute increment below.
min_bid_increment_percentage = 0

# Fixed proxy bid increment in ducats
min_bid_increment_absolute = 10

# Starting bid as percentage of item base value (e.g., 60 = 60%)
starting_bid_percentage = 60

# Rate limit: maximum bids per minute per player
max_bids_per_minute = 10

# Enable/disable auto-bid feature (0 = disabled, 1 = enabled)
auto_bid_enabled = 0

[auction.snipe_protection]
# Enable snipe protection (0 = disabled, 1 = enabled)
snipe_protection_enabled = 1

# Time window in minutes before auction end that triggers extension
snipe_trigger_window_minutes = 2

# Extension duration in minutes when bid placed in trigger window
extension_duration_minutes = 2

# Maximum number of extensions allowed per item
max_extensions_per_item = 5

[auction.fees]
# Auction house fee percentage for player-submitted items (e.g., 5 = 5%)
# Seller receives (winning_bid * (100 - fee_percentage) / 100)
player_item_fee_percentage = 5

# Auction house fee for system-generated items (usually 0)
system_item_fee_percentage = 0

# Whether to charge a listing fee when player submits item
listing_fee_enabled = 0
listing_fee_ducats = 0

[auction.rewards]
# Pending reward expiry time in days
pending_reward_expiry_days = 7

# Refund percentage for expired unclaimed rewards (e.g., 80 = 80%)
expired_reward_refund_percentage = 80

[auction.level_brackets]
# Level bracket size (e.g., 10 = brackets of 10 levels)
bracket_size = 10

# Maximum level (used to calculate number of brackets)
max_level = 100

# Level brackets will be auto-generated as:
# [1-10], [11-20], [21-30], ..., [91-100]

[auction.settlement]
# Settlement check interval in minutes (how often to check for ended auctions)
settlement_check_interval_minutes = 1

# Expired rewards check interval in minutes
expired_rewards_check_interval_minutes = 60

[auction.item_generation]
# For system-generated items

# Base value multiplier per item level (base_value = level * multiplier)
base_value_per_level = 10

# Rarity multipliers for starting bid calculation
# Format: common,uncommon,rare,epic
rarity_multipliers = 1,3,10,30

[auction.economy]
# Currency type for auctions (ducats only for now)
auction_currency = ducats

# Allow bidding with premium currency (0 = no, 1 = yes)
allow_imperials = 0

# Minimum player level required to participate in auctions
min_player_level = 5

# Minimum player level required to submit items
min_player_level_submit = 1

# Maximum active submissions per player (approved + listed)
max_player_active_submissions = 5

[auction.ui]
# Number of bid history entries to show
bid_history_limit = 5

# Poll interval for frontend updates in seconds
ui_poll_interval_seconds = 10

# Show player names in bid history (0 = anonymous, 1 = show names)
show_player_names = 0

[auction.debug]
# Enable test endpoints in production (0 = disabled, 1 = enabled)
# WARNING: Keep disabled in production!
enable_test_endpoints = 0

# Enable verbose logging
verbose_logging = 0
