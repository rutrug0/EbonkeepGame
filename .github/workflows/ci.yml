name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ebonkeep
          POSTGRES_PASSWORD: ebonkeep
          POSTGRES_DB: ebonkeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ebonkeep -d ebonkeep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 4010
      TEST_API_PORT: 4010
      TEST_WEB_PORT: 4173
      TEST_DATABASE_URL: postgresql://ebonkeep:ebonkeep@localhost:5432/ebonkeep?schema=test
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_JWT_SECRET: test-super-secret
      DEV_GUEST_AUTH: "true"
      EBONKEEP_SKIP_DOCKER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run CI test gate
        run: npm run test:ci

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/api/coverage
            apps/web/coverage
            packages/shared/coverage
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
